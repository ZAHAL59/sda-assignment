<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Shaheen — Student Portal</title>
<style>
:root{
  --ink:#0f172a;--ink2:#334155;--ink3:#64748b;--ink4:#94a3b8;
  --line:#e2e8f0;--line2:#f1f5f9;--bg:#f8fafc;--white:#fff;
  --blue:#3b82f6;--blue-d:#1d4ed8;--blue-l:#eff6ff;
  --green:#10b981;--green-l:#ecfdf5;--green-d:#065f46;
  --amber:#f59e0b;--amber-l:#fffbeb;
  --red:#ef4444;--red-l:#fef2f2;
  --radius:12px;--radius-lg:18px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button,input,textarea{font-family:inherit}

.wrap{max-width:820px;margin:0 auto;padding:32px 20px 80px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.t-logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#14b8a6,#059669);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.t-title{font-size:17px;font-weight:700;color:var(--ink)}
.t-sub{font-size:12px;color:var(--ink4)}

/* Import */
.import-card{background:var(--white);border:1.5px dashed var(--line);border-radius:var(--radius-lg);padding:56px 32px;text-align:center}
.import-card h2{font-size:19px;font-weight:700;color:var(--ink);margin-bottom:8px}
.import-card p{font-size:13px;color:var(--ink3);margin-bottom:24px;line-height:1.6}
.file-label{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.file-label:hover{background:var(--blue-d)}
input[type=file]{display:none}
.err-box{background:var(--red-l);border:1px solid #fecaca;color:#b91c1c;border-radius:10px;padding:10px 14px;font-size:13px;margin-top:14px}

/* Quiz header */
.quiz-hdr{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px 22px;margin-bottom:18px}
.quiz-hdr h2{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:3px}
.quiz-hdr-meta{font-size:13px;color:var(--ink4)}
.quiz-hdr-desc{font-size:13px;color:var(--ink3);margin-top:7px;line-height:1.5}
.prog-bar{height:5px;background:var(--line);border-radius:99px;margin-top:14px;overflow:hidden}
.prog-fill{height:100%;background:var(--blue);border-radius:99px;transition:width .2s}

/* Question cards */
.q-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px 22px;margin-bottom:14px}
.q-num{font-size:11px;color:var(--ink4);margin-bottom:3px}
.q-kind{font-size:10px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.q-prompt{font-size:15px;font-weight:600;color:var(--ink);line-height:1.55;margin-bottom:16px}

/* Options */
.opt-btn{width:100%;text-align:left;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--white);border-radius:10px;padding:11px 13px;font-size:14px;color:var(--ink2);cursor:pointer;margin-bottom:8px}
.opt-btn:hover{border-color:var(--ink4)}
.opt-btn.sel{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d);font-weight:500}
.opt-letter{width:22px;height:22px;border-radius:50%;background:var(--line2);color:var(--ink4);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt-btn.sel .opt-letter{background:var(--blue);color:#fff}

/* TF */
.tf-row{display:flex;gap:10px}
.tf-btn{flex:1;text-align:center;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--white);font-size:14px;font-weight:500;cursor:pointer}
.tf-btn.sel{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d)}

/* Input */
.ans-input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;outline:none;transition:border-color .15s}
.ans-input:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
textarea.ans-input{resize:vertical;min-height:90px}

/* Spot */
.token-pill{display:inline-block;border:1px solid var(--line);background:var(--white);border-radius:7px;padding:6px 10px;font-size:14px;margin:3px;cursor:pointer}
.token-pill.marked{border-color:var(--amber);background:var(--amber-l);color:#92400e;font-weight:600}
.choice-row{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.choice-btn{padding:9px 15px;border-radius:9px;border:1px solid var(--line);background:var(--white);font-size:13px;cursor:pointer}
.choice-btn.sel{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d);font-weight:500}

/* Match */
.match-grid{display:flex;gap:18px;margin-top:4px}
.match-col{flex:1;display:flex;flex-direction:column;gap:7px}
.match-item{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;cursor:pointer;background:var(--white);text-align:left}
.match-item.pending{border-color:var(--blue);background:var(--blue-l)}
.match-item.paired{border-color:var(--green);background:var(--green-l)}
.pair-tag{font-size:10px;font-weight:700;color:#fff;background:var(--ink4);border-radius:99px;padding:1px 6px;margin-left:5px}

/* Submit */
.submit-bar{display:flex;justify-content:flex-end;margin-top:10px;gap:10px}
.btn-primary{background:var(--blue);color:#fff;border:none;padding:11px 24px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.btn-primary:hover{background:var(--blue-d)}
.btn-secondary{background:var(--white);color:var(--ink2);border:1px solid var(--line);padding:11px 24px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.btn-secondary:hover{background:var(--line2)}

/* Results */
.score-banner{background:linear-gradient(135deg,var(--blue-d),#0f766e);border-radius:var(--radius-lg);padding:28px 24px;text-align:center;color:#fff;margin-bottom:20px}
.score-num{font-size:48px;font-weight:800;line-height:1}
.score-label{font-size:13px;opacity:.75;margin-top:5px}
.result-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--line);border-left:4px solid var(--line);padding:14px 18px;margin-bottom:10px}
.result-card.correct{border-left-color:var(--green)}
.result-card.incorrect{border-left-color:var(--red)}
.result-card.pending{border-left-color:var(--ink4)}
.result-card.partial{border-left-color:var(--amber)}
.result-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.result-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.result-tag.correct{background:var(--green-l);color:var(--green-d)}
.result-tag.incorrect{background:var(--red-l);color:#991b1b}
.result-tag.pending{background:var(--line2);color:var(--ink3)}
.result-tag.partial{background:var(--amber-l);color:#92400e}
.result-detail{font-size:12px;color:var(--ink3);margin-top:5px}
.result-extra{font-size:12px;color:#991b1b;margin-top:5px;padding:7px 10px;background:var(--red-l);border-radius:8px;line-height:1.6}
.result-card.correct .result-extra{color:var(--green-d);background:var(--green-l)}
.result-card.pending .result-extra{color:var(--ink3);background:var(--line2)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KIND_LABELS={mcq:'Multiple Choice',tf:'True / False',fillblank:'Fill in the Blank',oneword:'One-word / One-line',spotmistake:'Spot the Mistake',match:'Match the Following',descriptive:'Descriptive'};

let S={quiz:null,answers:{},screen:'import',error:null};

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── FILE IMPORT ───────────────────────────────────────────────────────────
function handleFile(input){
  const f=input.files&&input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.questions||!Array.isArray(d.questions))throw new Error('No questions array found.');
      // Normalise match questions (old format compatibility)
      d.questions=d.questions.map(q=>{
        if(q.kind!=='match')return q;
        if(q.columnA&&q.columnB&&q.options)return q;
        if(q.items&&q.items.length){
          const lA=['A','B','C','D'],lB=['p','q','r','s'];
          const items=q.items.slice(0,4);
          const colA=items.map((it,i)=>({letter:lA[i],text:it.left||it.term||''}));
          const colB=items.map((it,i)=>({letter:lB[i],text:it.right||it.definition||''}));
          const correctOpt=colA.map((a,i)=>a.letter+'-'+colB[i].letter).join(', ');
          const sh=[[0,2,1,3],[1,0,3,2],[2,3,0,1]];
          const wrong=sh.map(o=>colA.map((a,i)=>a.letter+'-'+colB[o[i]].letter).join(', '));
          const opts=[correctOpt,...wrong];
          const ci=Math.floor(Math.random()*4);
          [opts[0],opts[ci]]=[opts[ci],opts[0]];
          return {...q,columnA:colA,columnB:colB,options:opts,correctOptionIndex:ci,question:q.question||'Match the columns'};
        }
        return q;
      });
      S={quiz:d,answers:{},screen:'taking',error:null};render();
    }catch(e){S.error='Could not read file: '+e.message;render();}
  };
  r.onerror=()=>{S.error='Could not read file. Try again.';render();};
  r.readAsText(f);
}

// ── ANSWER SETTERS ────────────────────────────────────────────────────────
function setAns(id,v){S.answers[id]=v;render();}
function setTextAns(id,v){S.answers[id]=v;}
function spotToken(id,idx){S.answers[id]={wrongIndex:idx,choice:null};render();}
function spotChoice(id,c){
  const cur=S.answers[id]||{};
  if(cur.wrongIndex===undefined||cur.wrongIndex===null)return;
  S.answers[id]={...cur,choice:c};render();
}
function matchLeft(id,idx){return;// legacy
  const cur=S.answers[id]||{pairs:{},pending:null};
  if(cur.pairs[idx]!==undefined)return;
  cur.pending=idx;S.answers[id]=cur;render();
}
function matchRight(id,idx){return;// legacy
  const cur=S.answers[id]||{pairs:{},pending:null};
  if(cur.pending===null||cur.pending===undefined)return;
  if(Object.values(cur.pairs).includes(idx))return;
  cur.pairs[cur.pending]=idx;cur.pending=null;S.answers[id]=cur;render();
}
function resetMatch(id){S.answers[id]=undefined;render();}
function setDiagram(id,idx,v){const cur=S.answers[id]||{};cur[idx]=v;S.answers[id]=cur;}

// ── RENDER QUESTIONS ─────────────────────────────────────────────────────
function shell(q,qi,prompt,body){
  return `<div class="q-card">
    <div class="q-num">Question ${qi+1}</div>
    <div class="q-kind">${esc(KIND_LABELS[q.kind]||q.kind)}</div>
    ${prompt?`<div class="q-prompt">${prompt}</div>`:'<div style="height:4px"></div>'}
    ${body}
  </div>`;
}

function rMCQ(q,qi){
  const sel=S.answers[q.id];
  const opts=q.options.map((o,oi)=>`<button class="opt-btn ${sel===oi?'sel':''}" onclick="setAns('${q.id}',${oi})">
    <span class="opt-letter">${String.fromCharCode(65+oi)}</span><span>${esc(o)}</span></button>`).join('');
  return shell(q,qi,esc(q.question),opts);
}
function rTF(q,qi){
  const sel=S.answers[q.id];
  return shell(q,qi,esc(q.statement),`<div class="tf-row">
    <button class="tf-btn ${sel===true?'sel':''}" onclick="setAns('${q.id}',true)">True</button>
    <button class="tf-btn ${sel===false?'sel':''}" onclick="setAns('${q.id}',false)">False</button>
  </div>`);
}
function rFill(q,qi){
  const v=S.answers[q.id]||'';
  return shell(q,qi,esc(q.text),`<input class="ans-input" value="${esc(v)}" placeholder="Type your answer..." oninput="setTextAns('${q.id}',this.value)"/>`);
}
function rOneword(q,qi){
  const v=S.answers[q.id]||'';
  return shell(q,qi,esc(q.question),`<input class="ans-input" value="${esc(v)}" placeholder="Your answer..." oninput="setTextAns('${q.id}',this.value)"/>`);
}
function rDescriptive(q,qi){
  const v=S.answers[q.id]||'';
  return shell(q,qi,esc(q.question),`<textarea class="ans-input" rows="4" placeholder="Write your answer here..." oninput="setTextAns('${q.id}',this.value)">${esc(v)}</textarea>
    <p style="font-size:12px;color:var(--ink4);margin-top:7px">Your teacher will read and grade this.</p>`);
}
function rSpot(q,qi){
  const ans=S.answers[q.id]||{};
  const pills=q.tokens.map((w,i)=>`<button class="token-pill ${ans.wrongIndex===i?'marked':''}" onclick="spotToken('${q.id}',${i})">${esc(w)}</button>`).join('');
  let choices='';
  if(ans.wrongIndex!==null&&ans.wrongIndex!==undefined){
    const cs=q.choices&&q.choices.length?q.choices:[q.correct];
    choices=`<div style="font-size:12px;color:var(--ink4);margin-top:12px;margin-bottom:6px">Pick the correct word:</div>
      <div class="choice-row">${cs.map(c=>`<button class="choice-btn ${ans.choice===c?'sel':''}" onclick="spotChoice('${q.id}','${esc(c).replace(/'/g,"&#39;")}')">${esc(c)}</button>`).join('')}</div>`;
  }
  return shell(q,qi,null,`<div style="font-size:12px;color:var(--ink4);margin-bottom:8px">Step 1 — click the word that's wrong</div><div>${pills}</div>${choices}`);
}
function rMatch(q,qi){
  const sel=S.answers[q.id];
  const colA=q.columnA||[];
  const colB=q.columnB||[];
  const opts=(q.options||[]).map((opt,oi)=>`<button class="opt-btn ${sel===oi?'sel':''}" onclick="setAns('${q.id}',${oi})">
    <span class="opt-letter">${String.fromCharCode(49+oi)}</span><span>${esc(opt)}</span></button>`).join('');
  const body=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;background:var(--line2);border-radius:10px;padding:14px">
      <div>
        <div style="font-size:11px;font-weight:700;color:var(--blue-d);margin-bottom:8px;letter-spacing:.3px">Column I</div>
        ${colA.map(it=>`<div style="display:flex;gap:8px;margin-bottom:7px;font-size:13px;color:var(--ink2)"><span style="font-weight:700;color:var(--blue-d);flex-shrink:0">(${esc(it.letter)})</span><span>${esc(it.text)}</span></div>`).join('')}
      </div>
      <div>
        <div style="font-size:11px;font-weight:700;color:var(--green-d);margin-bottom:8px;letter-spacing:.3px">Column II</div>
        ${colB.map(it=>`<div style="display:flex;gap:8px;margin-bottom:7px;font-size:13px;color:var(--ink2)"><span style="font-weight:700;color:var(--green-d);flex-shrink:0">(${esc(it.letter)})</span><span>${esc(it.text)}</span></div>`).join('')}
      </div>
    </div>
    <div style="font-size:12px;color:var(--ink4);margin-bottom:8px">Select the correct combination:</div>
    ${opts}`;
  return shell(q,qi,esc(q.question||'Match the columns'),body);
}

function renderQ(q,qi){
  switch(q.kind){
    case 'mcq':return rMCQ(q,qi);
    case 'tf':return rTF(q,qi);
    case 'fillblank':return rFill(q,qi);
    case 'oneword':return rOneword(q,qi);
    case 'descriptive':return rDescriptive(q,qi);
    case 'spotmistake':return rSpot(q,qi);
    case 'match':return rMatch(q,qi);
    default:return '';
  }
}

// ── GRADING ───────────────────────────────────────────────────────────────
function norm(s){return String(s||'').trim().toLowerCase();}

// Levenshtein distance — allows small typos
function levenshtein(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}

// Accept if distance <= 1 for short words, <= 2 for longer words
function fuzzyMatch(student,correct){
  const s=norm(student),c=norm(correct);
  if(s===c)return true;
  const maxDist=c.length<=4?0:c.length<=8?1:2;
  return levenshtein(s,c)<=maxDist;
}
function grade(q){

  const a=S.answers[q.id];
  if(q.kind==='mcq'){
    if(a===undefined)return{status:'pending',detail:'Not answered',extra:''};
    const correct=a===q.correctIndex;
    return{status:correct?'correct':'incorrect',
      detail:correct?'Your answer: '+esc(q.options[a]):'Your answer: '+esc(q.options[a]),
      extra:correct?'':'Correct answer: '+esc(q.options[q.correctIndex])};
  }
  if(q.kind==='tf'){
    if(a===undefined)return{status:'pending',detail:'Not answered',extra:''};
    const correct=a===q.isTrue;
    return{status:correct?'correct':'incorrect',
      detail:'Your answer: '+(a?'True':'False'),
      extra:correct?'':'Correct answer: '+(q.isTrue?'True':'False')};
  }
  if(q.kind==='fillblank'||q.kind==='oneword'){
    if(!a)return{status:'pending',detail:'Not answered',extra:''};
    const correct=fuzzyMatch(a,q.answer);
    const near=!correct&&levenshtein(norm(a),norm(q.answer))<=2;
    return{status:correct?'correct':near?'partial':'incorrect',
      detail:'Your answer: '+esc(a),
      extra:correct?'':(near?'Almost correct! ':'')+'Correct answer: '+esc(q.answer)};
  }
  if(q.kind==='spotmistake'){
    if(!a||a.wrongIndex===undefined||!a.choice)return{status:'pending',detail:'Not completed',extra:''};
    const wordOk=a.wrongIndex===q.wrongIndex;
    const choiceOk=norm(a.choice)===norm(q.correct);
    const ok=wordOk&&choiceOk;
    let detail='You picked: "'+esc(q.tokens[a.wrongIndex]||'?')+'" → "'+esc(a.choice||'?')+'"';
    let extra=ok?'':'Correct: "'+esc(q.tokens[q.wrongIndex])+'" → "'+esc(q.correct)+'"';
    if(!wordOk&&!choiceOk) extra='Wrong word and wrong replacement. '+extra;
    else if(!wordOk) extra='Right replacement but wrong word identified. '+extra;
    else if(!choiceOk) extra='Right word identified but wrong replacement. '+extra;
    return{status:ok?'correct':'incorrect',detail,extra};
  }
  if(q.kind==='match'){
    if(a===undefined)return{status:'pending',detail:'Not answered',extra:''};
    const correct=a===q.correctOptionIndex;
    return{
      status:correct?'correct':'incorrect',
      detail:'Your answer: '+esc((q.options||[])[a]||'?'),
      extra:correct?'':'Correct answer: '+esc((q.options||[])[q.correctOptionIndex]||'?')
    };
  }
  if(q.kind==='descriptive'){
    return{status:'pending',detail:a?'Submitted — awaiting teacher review':'Not answered',extra:''};
  }
  return{status:'pending',detail:'',extra:''};
}

function submitQuiz(){S.screen='results';render();window.scrollTo({top:0,behavior:'smooth'});}
function retakeQuiz(){S.answers={};S.screen='taking';render();window.scrollTo({top:0,behavior:'smooth'});}
function backToImport(){S={quiz:null,answers:{},screen:'import',error:null};render();}

function exportResult(){
  const q=S.quiz;
  const graded=q.questions.map(qq=>{
    const r=grade(qq);
    const a=S.answers[qq.id];
    let studentAnswerText='';
    if(qq.kind==='mcq') studentAnswerText=a!==undefined?(qq.options||[])[a]||'':'Not answered';
    else if(qq.kind==='tf') studentAnswerText=a===undefined?'Not answered':a?'True':'False';
    else if(qq.kind==='fillblank'||qq.kind==='oneword') studentAnswerText=a||'Not answered';
    else if(qq.kind==='descriptive') studentAnswerText=a||'Not answered';
    else if(qq.kind==='spotmistake') studentAnswerText=a?'"'+(qq.tokens[a.wrongIndex]||'?')+'" → "'+a.choice+'"':'Not answered';
    else if(qq.kind==='match') studentAnswerText=a!==undefined?(qq.options||[])[a]||'':'Not answered';
    return {
      questionId:qq.id, kind:qq.kind,
      questionText:qq.question||qq.statement||qq.text||(qq.tokens||[]).join(' ')||'Match the columns',
      studentAnswer:studentAnswerText,
      autoStatus:r.status,
      teacherOverride:null,
      finalStatus:r.status,
      question:qq,
    };
  });
  const payload={
    format:'shaheen-result-v1',
    studentResult:true,
    quizTitle:q.title,
    submittedAt:new Date().toISOString(),
    autoScore:graded.filter(g=>g.autoStatus==='correct'||g.autoStatus==='partial').length,
    totalAuto:graded.filter(g=>g.kind!=='descriptive').length,
    answers:graded,
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const slug=(q.title||'result').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
  const link=document.createElement('a');link.href=url;link.download=slug+'_result.json';
  document.body.appendChild(link);link.click();document.body.removeChild(link);URL.revokeObjectURL(url);
}

// ── SCREENS ───────────────────────────────────────────────────────────────
function importScreen(){
  return `<div class="import-card">
    <h2>Load Your Assignment</h2>
    <p>Ask your teacher for the assignment file (.json) and open it here to begin.</p>
    <label class="file-label" for="fi">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Choose Assignment File
    </label>
    <input id="fi" type="file" accept="application/json,.json" onchange="handleFile(this)"/>
    ${S.error?`<div class="err-box">${esc(S.error)}</div>`:''}
  </div>`;
}

function takingScreen(){
  const q=S.quiz;
  const answered=q.questions.filter(qq=>{
    const a=S.answers[qq.id];
    if(qq.kind==='spotmistake')return a&&a.choice;
    if(qq.kind==='match')return a&&a.pairs&&Object.keys(a.pairs).length===qq.items.length;
    return a!==undefined&&a!=='';
  }).length;
  const pct=Math.round(answered/q.questions.length*100);

  return `<div class="quiz-hdr">
    <h2>${esc(q.title)}</h2>
    <div class="quiz-hdr-meta">${q.questions.length} question${q.questions.length!==1?'s':''}</div>
    ${q.description?`<div class="quiz-hdr-desc">${esc(q.description)}</div>`:''}
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
  </div>
  ${q.questions.map((qq,i)=>renderQ(qq,i)).join('')}
  <div class="submit-bar">
    <button class="btn-primary" onclick="submitQuiz()">Submit</button>
  </div>`;
}

function resultsScreen(){
  const q=S.quiz;
  const graded=q.questions.map(qq=>({q:qq,r:grade(qq)}));
  const auto=graded.filter(g=>g.q.kind!=='descriptive');
  const correct=auto.filter(g=>g.r.status==='correct'||g.r.status==='partial').length;
  const pct=auto.length?Math.round(correct/auto.length*100):0;

  // get question prompt text for display
  function qText(qq){
    if(qq.kind==='mcq')return qq.question;
    if(qq.kind==='tf')return qq.statement;
    if(qq.kind==='fillblank')return qq.text;
    if(qq.kind==='oneword')return qq.question;
    if(qq.kind==='descriptive')return qq.question;
    if(qq.kind==='spotmistake')return qq.tokens.join(' ');
    if(qq.kind==='match')return 'Match the Following';
    return '';
  }

  const cards=graded.map(({q:qq,r},i)=>{
    const lbl=r.status==='correct'?'✓ Correct':r.status==='partial'?'◑ Almost':r.status==='incorrect'?'✗ Incorrect':'⏳ Pending';
    const cls=r.status==='correct'?'correct':r.status==='partial'?'partial':r.status==='incorrect'?'incorrect':'pending';
    const tagCls=cls;

    // Build a readable question display
    let questionDisplay='';
    if(qq.kind==='mcq'){
      questionDisplay=esc(qq.question)+'<div style="margin-top:6px;display:flex;flex-direction:column;gap:3px">'+
        (qq.options||[]).map((o,oi)=>`<div style="font-size:12px;padding:3px 7px;border-radius:6px;background:${oi===qq.correctOptionIndex?'var(--green-l)':oi===S.answers[qq.id]&&oi!==qq.correctOptionIndex?'var(--red-l)':'var(--line2)'};color:${oi===qq.correctOptionIndex?'var(--green-d)':oi===S.answers[qq.id]&&oi!==qq.correctOptionIndex?'#991b1b':'var(--ink3)'}">
          ${String.fromCharCode(65+oi)}. ${esc(o)} ${oi===qq.correctOptionIndex?'✓':''}
        </div>`).join('')+'</div>';
    } else if(qq.kind==='tf'){
      questionDisplay=esc(qq.statement);
    } else if(qq.kind==='fillblank'){
      questionDisplay=esc(qq.text);
    } else if(qq.kind==='oneword'){
      questionDisplay=esc(qq.question);
    } else if(qq.kind==='descriptive'){
      questionDisplay=esc(qq.question);
    } else if(qq.kind==='spotmistake'){
      const ans=S.answers[qq.id]||{};
      questionDisplay=(qq.tokens||[]).map((w,wi)=>`<span style="display:inline-block;margin:2px 2px;padding:3px 7px;border-radius:6px;font-size:13px;background:${wi===qq.wrongIndex?'var(--red-l)':wi===ans.wrongIndex&&wi!==qq.wrongIndex?'var(--amber-l)':'var(--line2)'};color:${wi===qq.wrongIndex?'#991b1b':'var(--ink2)'};">${esc(w)}</span>`).join(' ');
    } else if(qq.kind==='match'){
      questionDisplay='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px">'+
        '<div><div style="font-size:10px;font-weight:700;color:var(--blue-d);margin-bottom:5px">Column I</div>'+
        (qq.columnA||[]).map(it=>`<div style="font-size:12px;color:var(--ink2);margin-bottom:3px"><b style="color:var(--blue-d)">(${esc(it.letter)})</b> ${esc(it.text)}</div>`).join('')+'</div>'+
        '<div><div style="font-size:10px;font-weight:700;color:var(--green-d);margin-bottom:5px">Column II</div>'+
        (qq.columnB||[]).map(it=>`<div style="font-size:12px;color:var(--ink2);margin-bottom:3px"><b style="color:var(--green-d)">(${esc(it.letter)})</b> ${esc(it.text)}</div>`).join('')+'</div></div>';
    }

    return `<div class="result-card ${cls}">
      <div class="result-top">
        <div style="flex:1">
          <div style="font-size:11px;color:var(--ink4);margin-bottom:4px">Q${i+1} · ${esc(KIND_LABELS[qq.kind]||qq.kind)}</div>
          <div style="font-size:13px;font-weight:600;color:var(--ink);line-height:1.5">${questionDisplay}</div>
        </div>
        <span class="result-tag ${tagCls}" style="white-space:nowrap;flex-shrink:0;margin-left:10px">${lbl}</span>
      </div>
      ${r.detail?`<div class="result-detail" style="margin-top:8px">${r.detail}</div>`:''}
      ${r.extra?`<div class="result-extra">${r.extra}</div>`:''}

    </div>`;
  }).join('');

  return `<div class="score-banner">
    <div class="score-num">${correct} / ${auto.length}</div>
    <div class="score-label">${pct}% correct (including near-correct answers)${q.questions.length>auto.length?' · written answers sent to teacher':''}</div>
  </div>

  ${cards}
  <div class="submit-bar" style="flex-direction:column;align-items:flex-end;gap:10px">
    <div style="background:var(--blue-l);border:1px solid #bfdbfe;border-radius:10px;padding:10px 14px;font-size:12px;color:var(--blue-d);width:100%;display:flex;align-items:center;gap:8px">
      <span style="font-size:16px">📤</span>
      <div>
        <div style="font-weight:600">Share with your teacher</div>
        <div style="color:var(--ink3)">Download your result file and send it to the teacher for review.</div>
      </div>
      <button class="btn-primary" style="flex-shrink:0;padding:8px 16px;font-size:13px" onclick="exportResult()">Download Result</button>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn-secondary" onclick="retakeQuiz()">Retake</button>
      <button class="btn-secondary" onclick="backToImport()">Load Another</button>
    </div>
  </div>`;
}

// ── ROOT RENDER ───────────────────────────────────────────────────────────
function render(){
  let body='';
  if(S.screen==='import')body=importScreen();
  else if(S.screen==='taking')body=takingScreen();
  else body=resultsScreen();

  document.getElementById('app').innerHTML=`<div class="wrap">
    <div class="topbar">
      <div class="t-logo">S</div>
      <div><div class="t-title">Student Portal</div><div class="t-sub">${S.quiz?esc(S.quiz.title):'No assignment loaded'}</div></div>
    </div>
    ${body}
  </div>`;
}

render();
</script>
</body>
</html>
