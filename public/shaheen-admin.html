<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Shaheen — Create Assignment</title>
<style>
:root{
  --ink:#0f172a;--ink2:#334155;--ink3:#64748b;--ink4:#94a3b8;
  --line:#e2e8f0;--line2:#f1f5f9;--bg:#f8fafc;--white:#fff;
  --blue:#3b82f6;--blue-d:#1d4ed8;--blue-l:#eff6ff;
  --green:#10b981;--green-l:#ecfdf5;--green-d:#065f46;
  --amber:#f59e0b;--amber-l:#fffbeb;
  --red:#ef4444;--red-l:#fef2f2;
  --radius:12px;--radius-lg:18px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button,input,textarea,select{font-family:inherit}

/* Layout */
.shell{display:flex;min-height:100vh}
.sidebar{width:52px;background:var(--white);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:20px;flex-shrink:0}
.s-logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#14b8a6,#059669);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.s-icon{width:34px;height:34px;border-radius:9px;background:var(--green-l);color:var(--green);display:flex;align-items:center;justify-content:center}
.main{flex:1;display:flex;overflow:hidden}
.content{flex:1;padding:28px 32px;overflow-y:auto;transition:opacity .15s}
.content.dim{opacity:.35;pointer-events:none}

/* Panel */
.panel{width:400px;background:var(--white);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-6px 0 20px rgba(0,0,0,.06);flex-shrink:0;overflow-y:auto}
.panel-top{padding:22px 24px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-top h2{font-size:17px;font-weight:700;color:var(--blue-d)}
.close-btn{background:none;border:none;cursor:pointer;color:var(--ink4);padding:4px;display:flex;align-items:center;border-radius:6px}
.close-btn:hover{background:var(--line2);color:var(--ink2)}
.panel-body{padding:20px 24px;flex:1;display:flex;flex-direction:column;gap:18px}

/* Steps */
.step-bars{display:flex;gap:6px;padding:0 24px;margin-top:14px}
.step-bar{flex:1;height:4px;border-radius:99px;background:var(--line);transition:background .2s}
.step-bar.on{background:var(--blue)}

/* Fields */
.field{display:flex;flex-direction:column;gap:6px}
.field-label{font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.3px}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:10px 13px;font-size:14px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;background:var(--white)}
input[type=text]:focus,textarea:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
textarea{resize:vertical;min-height:80px}

/* Dropdown */
.dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:var(--radius);padding:10px 13px;font-size:14px;color:var(--ink);background:var(--white);cursor:pointer;transition:border-color .15s}
.dd-btn:hover{border-color:var(--ink4)}
.dd-list{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:4px}
.dd-item{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 13px;font-size:13px;background:var(--white);border:none;border-bottom:1px solid var(--line2);cursor:pointer;text-align:left;gap:10px}
.dd-item:last-child{border-bottom:none}
.dd-item:hover{background:var(--line2)}
.dd-item.sel{background:#eff6ff88;color:var(--blue-d);font-weight:500}

/* Resource zone */
.resource-box{border:1.5px dashed var(--line);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:12px}
.resource-box.has{border-color:var(--green);border-style:solid;background:var(--green-l)}
.upload-zone{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px dashed var(--line);border-radius:var(--radius);padding:20px 12px;cursor:pointer;gap:6px;background:var(--line2);transition:border-color .15s,background .15s;position:relative;min-height:90px}
.upload-zone:hover{border-color:var(--blue);background:var(--blue-l)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-zone-icon{font-size:22px}
.upload-zone-label{font-size:12px;font-weight:600;color:var(--ink2)}
.upload-zone-hint{font-size:11px;color:var(--ink4)}
.upload-done{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--green-d)}
.notes-toggle{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--blue);cursor:pointer;background:none;border:none;padding:0}

/* Type picker */
.type-row{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--white);transition:border-color .15s,background .15s;gap:10px}
.type-row.on{border-color:#93c5fd;background:var(--blue-l)}
.type-row-left{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1}
.type-icon{width:30px;height:30px;border-radius:8px;background:var(--line2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.type-row.on .type-icon{background:var(--blue-l)}
.type-name{font-size:13px;font-weight:500;color:var(--ink2)}
.type-row.on .type-name{color:var(--blue-d);font-weight:600}
.type-sub{font-size:11px;color:var(--ink4)}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--white)}
.stepper button{width:26px;height:26px;border:none;background:none;color:var(--blue);font-size:15px;font-weight:700;cursor:pointer}
.stepper button:hover{background:var(--blue-l)}
.stepper span{width:28px;text-align:center;font-size:13px;font-weight:700;color:var(--ink);border-left:1px solid var(--line);border-right:1px solid var(--line)}

/* Info chips */
.chip{display:flex;align-items:flex-start;gap:8px;font-size:12px;border-radius:10px;padding:10px 12px}
.chip.info{background:var(--blue-l);border:1px solid #bfdbfe;color:var(--blue-d)}
.chip.success{background:var(--green-l);border:1px solid #a7f3d0;color:var(--green-d)}
.chip.warn{background:var(--amber-l);border:1px solid #fde68a;color:#92400e}
.chip.neutral{background:var(--line2);border:1px solid var(--line);color:var(--ink3)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s,background .15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-d)}
.btn-primary:disabled{background:#bfdbfe;color:#93c5fd;cursor:not-allowed}
.btn-secondary{background:var(--white);color:var(--ink2);border:1px solid var(--line)}
.btn-secondary:hover{background:var(--line2)}
.btn-generate{background:linear-gradient(90deg,var(--blue),#14b8a6);color:#fff}
.btn-generate:disabled{background:#bfdbfe;color:#93c5fd;cursor:not-allowed}
.btn-row{display:flex;justify-content:flex-end;gap:10px;margin-top:auto;padding-top:8px}
.btn-row.spread{justify-content:space-between}

/* Generating */
.gen-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:40px 0}
.spin-ring{width:44px;height:44px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Review screen */
.review-wrap{max-width:1100px}
.review-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.review-header h1{font-size:20px;font-weight:700;color:var(--ink);margin-bottom:3px}
.review-meta{font-size:13px;color:var(--ink4)}
.review-banner{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3);background:var(--green-l);border:1px solid #a7f3d0;border-radius:10px;padding:10px 13px;margin-bottom:20px}
.q-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:14px}
.q-card{background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--line);padding:18px 20px}
.q-card-full{grid-column:1/-1}
.q-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.q-tag{font-size:11px;font-weight:700;color:var(--blue);flex-shrink:0;margin-top:5px;line-height:1.3;text-align:center}
.q-textarea{flex:1;border:1px solid transparent;border-radius:8px;padding:5px 8px;margin:-5px -8px;font-size:14px;font-weight:500;color:var(--ink);resize:none;font-family:inherit;line-height:1.5;background:transparent}
.q-textarea:hover{border-color:var(--line)}
.q-textarea:focus{border-color:#93c5fd;outline:none;background:var(--white)}
.rm-btn{background:none;border:none;cursor:pointer;color:var(--line);margin-top:3px;display:flex}
.rm-btn:hover{color:var(--red)}
.opt-list{display:flex;flex-direction:column;gap:7px;padding-left:26px}
.opt-row{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:9px;padding:8px 11px;cursor:pointer}
.opt-row.correct{border-color:#6ee7b7;background:var(--green-l)}
.opt-text{flex:1;border:none;background:transparent;font-size:13px;color:var(--ink2);font-family:inherit;outline:none}
.correct-tag{font-size:10px;font-weight:700;color:var(--green)}
.desc-note{padding-left:26px;font-size:12px;color:var(--ink4)}
.review-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}

/* Assignments list */
.list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.list-header h1{font-size:20px;font-weight:700;color:var(--ink)}
.a-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:14px}
.a-card-title{font-size:14px;font-weight:600;color:var(--ink)}
.a-card-meta{font-size:12px;color:var(--ink4);margin-top:3px}
.badge-pub{font-size:11px;font-weight:700;color:var(--green);background:var(--green-l);border:1px solid #a7f3d0;padding:3px 10px;border-radius:99px}
.empty-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);height:220px;display:flex;align-items:center;justify-content:center;color:var(--ink4);font-size:14px}

/* Toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.scroll-area{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding-right:2px}
</style>
</head>
<body>
<div class="shell">
  <div class="sidebar">
    <div class="s-logo">S</div>
    <div class="s-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    </div>
  </div>
  <div class="main">
    <div class="content" id="content"></div>
    <div id="panel-wrap"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────
const GEMINI_API_KEY = window.GEMINI_API_KEY || '__GEMINI_KEY__';

// ── DATA ─────────────────────────────────────────────────────────────────
const BATCHES = [
  {id:'b1',name:'Class 6 – Section A',students:34},
  {id:'b2',name:'Class 6 – Section B',students:31},
  {id:'b3',name:'Class 7 – Section A',students:29},
  {id:'b4',name:'Class 8 – Morning Batch',students:27},
];

const TYPES = [
  {id:'mcq',   label:'Multiple Choice',  sub:'Auto-graded',               icon:'☑'},
  {id:'tf',    label:'True / False',     sub:'Quick daily check',          icon:'⚖'},
  {id:'fillblank',label:'Fill in the Blank',sub:'Recall key terms',        icon:'✏'},
  {id:'oneword',label:'One-word / One-line',sub:'Fastest pulse check',     icon:'⚡'},
  {id:'spotmistake',label:'Spot the Mistake',sub:'Find the wrong word',    icon:'🔍'},
  {id:'match', label:'Match the Following',sub:'Pair terms & definitions (min 3 pairs)', icon:'🔗',min:3},
  {id:'descriptive',label:'Descriptive',sub:'Written answers',             icon:'📝'},
];

// ── STATE ────────────────────────────────────────────────────────────────
let S = {
  step: 1,
  batchId: null, batchOpen: false,
  title: '', description: '',
  resourceFile: null, resourceB64: null, resourceMime: null, resourceName: null,
  notes: '', showNotes: false,
  counts: {},
  prompt: '',
  questions: [],
  assignments: [],
  toast: null,
  generating: false,
  genError: null,
};

function batch(){ return BATCHES.find(b=>b.id===S.batchId)||null; }
function hasResource(){ return S.resourceB64 || S.notes.trim(); }
function canStep1(){ return !!S.batchId; }
function canStep2(){ return S.title.trim().length > 0 && hasResource(); }
function canStep3(){ return Object.values(S.counts).some(v=>v>0); }
function totalQ(){ return Object.values(S.counts).reduce((a,b)=>a+b,0); }
function selectedTypes(){ return TYPES.filter(t=>(S.counts[t.id]||0)>0); }

// ── ICONS (inline svg) ───────────────────────────────────────────────────
function svg(path,size=16){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
}
const SVGS = {
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  chevron: '<polyline points="6 9 12 15 18 9"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
  sparkle: '<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
};
function ic(name,size=16){return svg(SVGS[name]||'',size);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── GEMINI ───────────────────────────────────────────────────────────────
async function callGemini(parts){
  const key = GEMINI_API_KEY;
  if(!key) throw new Error('No Gemini API key.');
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts}],generationConfig:{temperature:0.4,maxOutputTokens:8192}})
  });
  if(!r.ok){const t=await r.text();throw new Error('Gemini '+r.status+': '+t.slice(0,200));}
  const d=await r.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text||'[]';
}

async function generateQuestions(){
  S.generating=true; S.genError=null; render();
  try {
    const parts=[];
    // Resource
    if(S.resourceB64){
      parts.push({inline_data:{mime_type:S.resourceMime,data:S.resourceB64}});
      parts.push({text:'Above is the teaching resource (PDF/image). Use it as the sole source for generating questions.'});
    }
    if(S.notes.trim()){
      parts.push({text:`Teaching notes / content:\n${S.notes}`});
    }

    // Build type-count instruction
    const typeInstructions = selectedTypes().map(t=>{
      const n=S.counts[t.id];
      if(t.id==='mcq') return `${n} MCQ questions (4 options each, mark correct with correctIndex 0-3)`;
      if(t.id==='tf') return `${n} True/False questions (set isTrue: true or false)`;
      if(t.id==='fillblank') return `${n} fill-in-the-blank questions (use _____ for the blank, provide answer)`;
      if(t.id==='oneword') return `${n} one-word/one-line questions (provide short answer)`;
      if(t.id==='spotmistake') return `${n} spot-the-mistake questions (tokens array of words, wrongIndex, correct replacement, choices array with 3 options including correct)`;
      if(t.id==='match') return `1 match-the-following set with ${n} pairs minimum (items array of {left,right})`;
      if(t.id==='descriptive') return `${n} descriptive questions`;
      return '';
    }).join('\n');

    const extraPrompt = S.prompt.trim() ? `\nExtra instruction: ${S.prompt}` : '';

    parts.push({text:`Generate the following questions STRICTLY from the provided resource content only. Do not use outside knowledge.

Types needed:
${typeInstructions}${extraPrompt}

Return ONLY a valid JSON array (no markdown, no backticks). Each item must have:
- "id": "q1","q2",... (sequential)
- "kind": one of: mcq|tf|fillblank|oneword|spotmistake|match|descriptive
- For mcq: "question","options":[4 strings],"correctIndex":0-3
- For tf: "statement","isTrue":true/false
- For fillblank: "text" (with _____), "answer"
- For oneword: "question","answer"
- For spotmistake: "tokens":[word array],"wrongIndex":int,"correct":string,"choices":[3 strings]
- For match: "items":[{"left":...,"right":...}] — one item in array for the whole set
- For descriptive: "question"

Generate exactly the numbers requested. Return only the JSON array.`});

    const raw=await callGemini(parts);
    const clean=raw.replace(/```json|```/g,'').trim();
    S.questions=JSON.parse(clean);
    S.step=5; // review
  } catch(e){
    S.genError=e.message;
    S.step=3;
  }
  S.generating=false;
  render();
}

// ── FILE UPLOAD ───────────────────────────────────────────────────────────
function handleFileUpload(input){
  const file=input.files?.[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    S.resourceB64=reader.result.split(',')[1];
    S.resourceMime=file.type||'application/pdf';
    S.resourceName=file.name;
    S.resourceFile=file;
    render();
  };
  reader.readAsDataURL(file);
  input.value='';
}

function removeFile(){S.resourceB64=null;S.resourceMime=null;S.resourceName=null;S.resourceFile=null;render();}

// ── PANELS ────────────────────────────────────────────────────────────────
function stepBarsHTML(){
  const total=3;
  return '<div class="step-bars">'+ Array.from({length:total},(_,i)=>`<div class="step-bar ${S.step>i?'on':''}"></div>`).join('')+'</div>';
}

function step1HTML(){
  const b=batch();
  let dropList='';
  if(S.batchOpen){
    dropList='<div class="dd-list">'+BATCHES.map(bt=>`
      <button class="dd-item ${S.batchId===bt.id?'sel':''}" onclick="selBatch('${bt.id}')">
        <span style="display:flex;align-items:center;gap:8px">${ic('users')} ${esc(bt.name)} <span style="color:var(--ink4);font-size:11px">(${bt.students} students)</span></span>
        ${S.batchId===bt.id?ic('check'):''}
      </button>`).join('')+'</div>';
  }
  return `
  <div class="field">
    <div class="field-label">Class / Batch</div>
    <button class="dd-btn" onclick="S.batchOpen=!S.batchOpen;render()">
      ${b?`<span style="display:flex;align-items:center;gap:8px">${ic('users')} ${esc(b.name)}</span>`:`<span style="color:var(--ink4)">Select a class or batch</span>`}
      ${ic('chevron')}
    </button>
    ${dropList}
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary" onclick="closePanel()">Close</button>
    <button class="btn btn-primary" ${canStep1()?'':'disabled'} onclick="go(2)">Continue</button>
  </div>`;
}

function step2HTML(){
  const b=batch();
  return `
  <div class="chip neutral" style="font-size:12px">${ic('users')} ${esc(b?b.name:'')}</div>
  <div class="field">
    <div class="field-label">Assignment title</div>
    <input type="text" id="inp-title" value="${esc(S.title)}" placeholder="e.g. Photosynthesis Homework" oninput="S.title=this.value;syncStep2()"/>
  </div>
  <div class="field">
    <div class="field-label">Description <span style="color:var(--ink4);font-weight:400">(optional)</span></div>
    <textarea id="inp-desc" placeholder="What should students focus on?" oninput="S.description=this.value" rows="2">${esc(S.description)}</textarea>
  </div>

  <div class="field">
    <div class="field-label">Resource — attach a PDF or image <span style="color:var(--ink4);font-weight:400">and/or type notes below</span></div>
    ${S.resourceB64 ? `
      <div class="resource-box has">
        <div class="upload-done">${ic('file')} ${esc(S.resourceName)} <button onclick="removeFile()" style="background:none;border:none;cursor:pointer;color:var(--red);font-size:11px;font-weight:700;margin-left:6px">✕ Remove</button></div>
      </div>` : `
      <div class="upload-zone">
        <input type="file" accept=".pdf,image/*" onchange="handleFileUpload(this)"/>
        <div class="upload-zone-icon">${ic('upload',22)}</div>
        <div class="upload-zone-label">Click or drag PDF / image here</div>
        <div class="upload-zone-hint">PDF, JPG, PNG supported</div>
      </div>`}
    <button class="notes-toggle" onclick="S.showNotes=!S.showNotes;render()">
      ${S.showNotes?'▾':'▸'} ${S.showNotes?'Hide':'Add'} notes manually
    </button>
    ${S.showNotes?`<textarea id="inp-notes" placeholder="Paste or type the lesson content here..." oninput="S.notes=this.value;syncStep2()" rows="5">${esc(S.notes)}</textarea>`:''}
  </div>

  ${S.resourceB64||S.notes.trim()?`<div class="chip success">${ic('check')} Resource ready — Gemini will generate from this content only.</div>`:`<div class="chip warn">⚠ Attach a PDF/image or enter notes before continuing.</div>`}

  ${S.genError?`<div class="chip" style="background:var(--red-l);border:1px solid #fecaca;color:#991b1b">⚠ ${esc(S.genError)}</div>`:''}

  <div class="btn-row spread">
    <button class="btn btn-secondary" onclick="go(1)">Back</button>
    <button class="btn btn-primary" id="btn-cont2" ${canStep2()?'':'disabled'} onclick="go(3)">Continue</button>
  </div>`;
}

function step3HTML(){
  const total=totalQ();
  const rows=TYPES.map(t=>{
    const n=S.counts[t.id]||0;
    const on=n>0;
    const stepper=on?`<div class="stepper">
      <button onclick="dec('${t.id}')">−</button>
      <span>${n}</span>
      <button onclick="inc('${t.id}')" ${n>=8?'disabled':''}>+</button>
    </div>`:`<button onclick="inc('${t.id}')" style="font-size:12px;font-weight:600;color:var(--blue);background:none;border:none;cursor:pointer">+ Add</button>`;
    return `<div class="type-row ${on?'on':''}">
      <div class="type-row-left" onclick="toggle('${t.id}')">
        <div class="type-icon">${t.icon}</div>
        <div><div class="type-name">${esc(t.label)}</div><div class="type-sub">${esc(t.sub)}</div></div>
      </div>
      ${stepper}
    </div>`;
  }).join('');

  return `
  <div class="field">
    <div class="field-label">What should this assignment include?</div>
    <div class="scroll-area">${rows}</div>
  </div>
  <div class="chip ${total>0?'success':'neutral'}">
    ${ic('sparkle',13)} ${total>0?`${total} question${total!==1?'s':''} across ${selectedTypes().length} format${selectedTypes().length!==1?'s':''}`:'Pick at least one format above'}
  </div>
  <div class="field">
    <div class="field-label">Extra instruction for AI <span style="color:var(--ink4);font-weight:400">(optional)</span></div>
    <textarea placeholder='e.g. "Keep it simple, this is for revision"' oninput="S.prompt=this.value" rows="2">${esc(S.prompt)}</textarea>
  </div>
  <div class="btn-row spread">
    <button class="btn btn-secondary" onclick="go(2)">Back</button>
    <button class="btn btn-generate" ${canStep3()?'':'disabled'} onclick="go(4);generateQuestions()">
      ${ic('sparkle')} Generate
    </button>
  </div>`;
}

function step4HTML(){
  return `
  <div class="gen-center">
    <div class="spin-ring"></div>
    <div>
      <div style="font-size:14px;font-weight:600;color:var(--ink2)">Gemini is reading the resource…</div>
      <div style="font-size:12px;color:var(--ink4);margin-top:4px">Generating ${totalQ()} questions — this takes a few seconds</div>
    </div>
  </div>`;
}

function panelHTML(){
  let body='';
  if(S.step===1)body=step1HTML();
  else if(S.step===2)body=step2HTML();
  else if(S.step===3)body=step3HTML();
  else if(S.step===4)body=step4HTML();
  return `<div class="panel">
    <div class="panel-top">
      <h2>Create Assignment</h2>
      <button class="close-btn" onclick="closePanel()">${ic('x',16)}</button>
    </div>
    ${stepBarsHTML()}
    <div class="panel-body">${body}</div>
  </div>`;
}

// ── REVIEW ────────────────────────────────────────────────────────────────
const KIND_LABELS={mcq:'Multiple Choice',tf:'True / False',fillblank:'Fill in the Blank',oneword:'One-word',spotmistake:'Spot the Mistake',match:'Match the Following',descriptive:'Descriptive'};
const TEXT_FIELD={mcq:'question',tf:'statement',fillblank:'text',oneword:'question',descriptive:'question'};

function qCardHTML(q,qi){
  const field=TEXT_FIELD[q.kind];
  let body='';
  if(q.kind==='mcq'){
    body=`<div class="opt-list">`+q.options.map((opt,oi)=>`
      <label class="opt-row ${q.correctIndex===oi?'correct':''}">
        <input type="radio" name="c-${q.id}" ${q.correctIndex===oi?'checked':''} onchange="S.questions.find(x=>x.id==='${q.id}').correctIndex=${oi};render()"/>
        <input class="opt-text" value="${esc(opt)}" oninput="S.questions.find(x=>x.id==='${q.id}').options[${oi}]=this.value"/>
        ${q.correctIndex===oi?'<span class="correct-tag">CORRECT</span>':''}
      </label>`).join('')+'</div>';
  } else if(q.kind==='tf'){
    body=`<div class="opt-list" style="flex-direction:row">
      <label class="opt-row ${q.isTrue?'correct':''}" style="flex:1;justify-content:center"><input type="radio" name="tf-${q.id}" ${q.isTrue?'checked':''} onchange="S.questions.find(x=>x.id==='${q.id}').isTrue=true;render()"/> True</label>
      <label class="opt-row ${!q.isTrue?'correct':''}" style="flex:1;justify-content:center"><input type="radio" name="tf-${q.id}" ${!q.isTrue?'checked':''} onchange="S.questions.find(x=>x.id==='${q.id}').isTrue=false;render()"/> False</label>
    </div>`;
  } else if(q.kind==='fillblank'||q.kind==='oneword'){
    body=`<div class="opt-list"><div style="font-size:11px;color:var(--ink4);margin-bottom:4px">Answer</div><input style="border:1px solid var(--line);border-radius:8px;padding:7px 11px;width:100%;font-size:13px;outline:none" value="${esc(q.answer)}" oninput="S.questions.find(x=>x.id==='${q.id}').answer=this.value"/></div>`;
  } else if(q.kind==='descriptive'){
    body=`<p class="desc-note">Written answer — teacher-reviewed.</p>`;
  } else if(q.kind==='spotmistake'){
    const pills=q.tokens.map((w,i)=>`<button onclick="S.questions.find(x=>x.id==='${q.id}').wrongIndex=${i};render()" style="border:1px solid ${q.wrongIndex===i?'#fca5a5':'var(--line)'};background:${q.wrongIndex===i?'#fef2f2':'#fff'};color:${q.wrongIndex===i?'#b91c1c':'var(--ink2)'};border-radius:7px;padding:5px 9px;font-size:13px;cursor:pointer;font-weight:${q.wrongIndex===i?700:400}">${esc(w)}</button>`).join(' ');
    body=`<div style="padding-left:26px"><div style="font-size:11px;color:var(--ink4);margin-bottom:7px">Click wrong word:</div><div style="display:flex;flex-wrap:wrap;gap:5px">${pills}</div>
      <div style="margin-top:10px;font-size:11px;color:var(--ink4)">Correct word:</div>
      <input style="border:1px solid #a7f3d0;background:var(--green-l);border-radius:8px;padding:6px 10px;width:180px;font-size:13px;font-weight:600;color:var(--green-d);outline:none;margin-top:4px" value="${esc(q.correct)}" oninput="S.questions.find(x=>x.id==='${q.id}').correct=this.value"/>
    </div>`;
  } else if(q.kind==='match'){
    const pairs=(q.items||[]).map((p,i)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
      <input style="border:1px solid var(--line);border-radius:7px;padding:6px 10px;flex:1;font-size:13px;outline:none" value="${esc(p.left)}" oninput="S.questions.find(x=>x.id==='${q.id}').items[${i}].left=this.value"/>
      <span style="color:var(--ink4)">↔</span>
      <input style="border:1px solid var(--line);border-radius:7px;padding:6px 10px;flex:1;font-size:13px;outline:none" value="${esc(p.right)}" oninput="S.questions.find(x=>x.id==='${q.id}').items[${i}].right=this.value"/>
    </div>`).join('');
    return `<div class="q-card q-card-full">
      <div class="q-head">
        <div class="q-tag">Q${qi+1}<br/><span style="font-size:10px;color:var(--ink4)">Match</span></div>
        <div style="flex:1;font-size:14px;font-weight:500;padding-top:4px;color:var(--ink)">Match the Following</div>
        <button class="rm-btn" onclick="S.questions=S.questions.filter(x=>x.id!=='${q.id}');render()">${svg(SVGS.x)}</button>
      </div>
      <div style="padding-left:26px">${pairs}</div>
    </div>`;
  }

  return `<div class="q-card">
    <div class="q-head">
      <div class="q-tag">Q${qi+1}<br/><span style="font-size:10px;color:var(--ink4)">${esc(KIND_LABELS[q.kind]||q.kind)}</span></div>
      <textarea class="q-textarea" rows="2" oninput="S.questions.find(x=>x.id==='${q.id}').${field}=this.value">${esc(q[field]||'')}</textarea>
      <button class="rm-btn" onclick="S.questions=S.questions.filter(x=>x.id!=='${q.id}');render()">${svg(SVGS.x)}</button>
    </div>
    ${body}
  </div>`;
}

function reviewHTML(){
  const b=batch();
  const cards=S.questions.length===0
    ?`<div class="empty-card" style="grid-column:1/-1">No questions — remove all and start over.</div>`
    :S.questions.map((q,i)=>qCardHTML(q,i)).join('');
  return `<div class="review-wrap">
    <div class="review-header">
      <div>
        <h1>${esc(S.title||'Untitled Assignment')}</h1>
        <div class="review-meta">${esc(b?b.name:'')} · ${S.questions.length} question${S.questions.length!==1?'s':''}</div>
      </div>
      <button class="btn btn-secondary" onclick="resetAll()">Start over</button>
    </div>
    <div class="review-banner">${ic('check')} Generated from your resource. Edit any question below, then publish.</div>
    <div class="q-grid">${cards}</div>
    <div class="review-actions">
      <button class="btn btn-secondary" onclick="go(3);S.step=3;render()">Regenerate</button>
      <button class="btn btn-primary" ${S.questions.length===0?'disabled':''} onclick="publish()">Publish to ${esc(b?b.name:'batch')}</button>
    </div>
  </div>`;
}

function listHTML(){
  const as=S.assignments;
  return `<div class="review-wrap">
    <div class="list-header">
      <h1>Assignments</h1>
      <button class="btn btn-primary" onclick="openPanel()">${ic('plus')} Create Assignment</button>
    </div>
    ${as.length===0?`<div class="empty-card">No assignments yet — create one to get started.</div>`
    :as.map(a=>`<div class="a-card">
      <div>
        <div class="a-card-title">${esc(a.title)}</div>
        <div class="a-card-meta">${esc(a.batchName)} · ${a.questions.length} questions</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <button class="btn btn-secondary" style="font-size:12px;padding:7px 12px" onclick="exportJSON('${a.id}')">${ic('file',13)} Export JSON</button>
        <span class="badge-pub">Published</span>
      </div>
    </div>`).join('')}
  </div>`;
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render(){
  const showPanel = S.step>=1 && S.step<=4;
  const showReview = S.step===5;

  document.getElementById('content').className='content'+(showPanel&&!showReview?' dim':'');
  document.getElementById('content').innerHTML = showReview ? reviewHTML() : listHTML();
  document.getElementById('panel-wrap').innerHTML = showPanel ? panelHTML() : '';

  const t=document.getElementById('toast');
  if(S.toast){t.textContent=S.toast;t.classList.add('show');}
  else{t.classList.remove('show');}
}

// ── ACTIONS ───────────────────────────────────────────────────────────────
function openPanel(){S.step=1;render();}
function closePanel(){S.step=0;render();}
function go(n){S.step=n;S.batchOpen=false;render();}
function selBatch(id){S.batchId=id;S.batchOpen=false;render();}
function syncStep2(){const btn=document.getElementById('btn-cont2');if(btn)btn.disabled=!canStep2();}
function toggle(id){const t=TYPES.find(x=>x.id===id);const min=t&&t.min?t.min:3;S.counts[id]=(S.counts[id]||0)>0?0:min;render();}
function inc(id){S.counts[id]=Math.min((S.counts[id]||0)+1,8);render();}
function dec(id){const t=TYPES.find(x=>x.id===id);const min=t&&t.min&&(S.counts[id]||0)>0?t.min:0;S.counts[id]=Math.max((S.counts[id]||0)-1,min);render();}
function resetAll(){S.step=1;S.batchId=null;S.title='';S.description='';S.resourceB64=null;S.resourceMime=null;S.resourceName=null;S.notes='';S.showNotes=false;S.counts={};S.prompt='';S.questions=[];S.genError=null;render();}

function publish(){
  const b=batch();
  S.assignments.unshift({
    id:'a'+Date.now(),
    title:S.title||'Untitled',
    description:S.description||'',
    batchName:b?b.name:'',
    batchId:S.batchId,
    questions:S.questions,
  });
  S.toast='Published to '+(b?b.name:'batch');
  S.step=0;
  render();
  setTimeout(()=>{S.toast=null;render();},3000);
}

function exportJSON(id){
  const a=S.assignments.find(x=>x.id===id);if(!a)return;
  const blob=new Blob([JSON.stringify({format:'shaheen-quiz-v1',...a},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const slug=(a.title||'quiz').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
  const link=document.createElement('a');link.href=url;link.download=slug+'.json';
  document.body.appendChild(link);link.click();document.body.removeChild(link);URL.revokeObjectURL(url);
}

render();
</script>
</body>
</html>
